server:
  port: 8083
spring:
  application:
    name: student-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/student_db}
    username: ${DATABASE_USERNAME:school}
    password: ${DATABASE_PASSWORD:school}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/school}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
app:
  security-enabled: ${APP_SECURITY_ENABLED:true}
